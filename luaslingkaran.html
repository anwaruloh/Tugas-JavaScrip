<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Mencari Luas Keliling</title>
</head>
<body>
     <form onsubmit="return false">
          <label for="jari_jari">Masukkan jari-jari:</label>  
          <input type="number" id="jari_jari" min="0" required>
          <button onclick="hitungLuasLingkaran()">Hitung Luas Lingkaran</button>
      </form>
      <div id="hasil"></div>
      
      <script>
          function hitungLuasLingkaran() {
              const PI = Math.PI; 
              let jari = parseFloat(document.getElementById('jari_jari').value);
      
            
              if (isNaN(jari) || jari < 0) {
                  document.getElementById('hasil').innerHTML = "Masukkan angka yang valid!";
                  return;
              }
      
              let hasil = PI * jari * jari;
              document.getElementById('hasil').innerHTML = `Luas Lingkaran = ${hasil.toFixed(2)}`;
          }
      </script>
      
</body>
</html>
